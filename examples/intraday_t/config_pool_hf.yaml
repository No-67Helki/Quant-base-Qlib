# =============================================================================
# 单股票日内做T (Pool 训练版) - DoubleEnsemble + Alpha158HF + 嵌套TWAP
# -----------------------------------------------------------------------------
# 关键点：
#   * 训练数据扩展到创业板 + 科创板 1666 只股票池 (data/cn_data_pool)
#   * 模型在全池子上学习「截面因子 → 未来收益」的普适映射
#   * 回测仍仅交易 SZ301536，1min TWAP 拆单
#   * 截面归一化 CSZScoreNorm 替代 RobustZScoreNorm
# 用法：
#   python workflow.py run_once --config config_pool_hf.yaml --exp_name intraday_t_pool
# =============================================================================
qlib_init:
    provider_uri:
        day:    "../../data/cn_data_pool"
        1min:   "../../data/cn_data_1min"
    dataset_cache: null
    expression_cache: null
    region: cn

market: &market all                 # 训练池：cn_data_pool/instruments/all.txt
benchmark: &benchmark SZ301536

data_handler_config: &data_handler_config
    start_time: 2022-01-04
    end_time:   2026-04-28
    fit_start_time: 2022-01-04
    fit_end_time:   2025-09-30
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm        # 在 fit 区间逐特征鲁棒 zscore
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: CSZScoreNorm            # 每日截面 zscore（关键！让信号是相对强弱）
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm            # 标签也做截面归一化，避免市场系统性涨跌主导损失
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

# 嵌套执行：日频决策 -> 1min TWAP 拆单
port_analysis_config: &port_analysis_config
    executor:
        class: NestedExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            inner_executor:
                class: SimulatorExecutor
                module_path: qlib.backtest.executor
                kwargs:
                    time_per_step: 1min
                    generate_portfolio_metrics: False
                    verbose: True
                    indicator_config:
                        show_indicator: True
            inner_strategy:
                class: TWAPStrategy
                module_path: qlib.contrib.strategy.rule_strategy
            track_data: True
            generate_portfolio_metrics: True
            verbose: True
            indicator_config:
                show_indicator: True

    strategy:
        class: IntradayTStrategy
        module_path: intraday_t_strategy
        kwargs:
            signal: <PRED>
            stock_id: "SZ301536"
            buy_thresh: 0.0008
            sell_thresh: -0.0008
            trade_unit: 100
            position_pct: 0.30
            allow_first_sell: True

    backtest:
        start_time: 2026-01-05
        end_time:   2026-04-24
        account:
            cash: 500000
            SZ301536:
                amount: 2000
                price: 61.74
        benchmark: *benchmark
        exchange_kwargs:
            codes: ["SZ301536"]      # 限定回测可交易标的，避免加载全池 1min 数据
            freq: 1min
            limit_threshold: 0.195
            deal_price: close
            open_cost:  0.0005
            close_cost: 0.0015
            min_cost:   5
            trade_unit: 100

task:
    model:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        kwargs:
            base_model: "gbm"
            loss: mse
            # 大样本配置：池子约 50~200 万行，可以放开模型容量
            num_models: 6
            enable_sr: True
            enable_fs: True
            alpha1: 1.0
            alpha2: 1.0
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
            sub_weights:   [1, 1, 1, 1, 1, 1]
            epochs: 200
            colsample_bytree: 0.85
            learning_rate: 0.05
            subsample: 0.85
            lambda_l1: 1.0
            lambda_l2: 5.0
            max_depth: 8
            min_child_samples: 200       # 大样本下提高，避免噪声叶
            num_leaves: 128
            num_threads: 8
            verbosity: 1

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158HF
                module_path: handlers.alpha158_hf
                kwargs: *data_handler_config
            segments:
                train: [2022-01-04, 2024-12-31]
                valid: [2025-01-01, 2025-09-30]
                test:  [2025-10-01, 2026-04-28]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model:   <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
