# =============================================================================
# 单股票日内做T - DoubleEnsemble + Alpha158 + 嵌套TWAP执行
# =============================================================================
qlib_init:
    provider_uri:
        day:    "../../data/cn_data"
        1min:   "../../data/cn_data_1min"
    dataset_cache: null
    expression_cache: null
    region: cn

# ---- 标的与基准 ----
# 注意：303516 为 6 位股票代码，按深市约定使用前缀 SZ
market: &market ["SZ301536"]
benchmark: &benchmark SZ301536

# ---- 数据处理器配置 ----
# SZ303516 上市日期：2024-03-28，历史约2年 (~500日)
# 方案B：缩减模型规模防止过拟合
data_handler_config: &data_handler_config
    start_time: 2024-03-28          # 从上市日开始取数
    end_time:   2026-04-28          # 当前日期
    fit_start_time: 2024-03-28      # 全量数据用于训练
    fit_end_time:   2025-09-30      # 留出约6个月做验证+测试
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        # 单股500条样本，仅做标签去NaN，不做截面归一化
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]   # T+1 日收益

# ---- 嵌套执行 + 回测配置 ----
# 嵌套执行：日频决策 -> 1min TWAP 拆单
# 依赖分钟数据位于 provider_uri.1min（../../data/cn_data_1min）
port_analysis_config: &port_analysis_config
    executor:
        class: NestedExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            inner_executor:
                class: SimulatorExecutor
                module_path: qlib.backtest.executor
                kwargs:
                    time_per_step: 1min
                    generate_portfolio_metrics: False
                    verbose: True
                    indicator_config:
                        show_indicator: True
            inner_strategy:
                class: TWAPStrategy
                module_path: qlib.contrib.strategy.rule_strategy
            track_data: True
            generate_portfolio_metrics: True
            verbose: True
            indicator_config:
                show_indicator: True

    strategy:
        class: IntradayTStrategy
        module_path: intraday_t_strategy
        kwargs:
            signal: <PRED>
            stock_id: "SZ301536"
            buy_thresh: 0.0008
            sell_thresh: -0.0008
            trade_unit: 100
            buy_pct: 0.30
            sell_pct: 0.50
            allow_first_sell: True
            # -- 风控开关（默认关闭，逐步开启） --
            enable_stop_loss: false
            stop_loss_pct: 0.03
            enable_adaptive_thresh: false
            adaptive_thresh_lookback: 60
            adaptive_thresh_percentile: 0.20
            enable_signal_guard: true

    backtest:
        start_time: 2026-01-05          # 最近约4个月做回测（数据最新段）
        end_time:   2026-04-24
        account:
            cash: 500000
            SZ301536:
                amount: 2000
                price: 61.74   # 2026-01-05 收盘价
                # price 留空则由 Qlib 用回测起点附近的close自动填充
        benchmark: *benchmark
        exchange_kwargs:
            codes: ["SZ301536"]
            freq: 1min
            limit_threshold: 0.195
            deal_price: $vwap
            open_cost:  0.0005
            close_cost: 0.0015
            min_cost:   5
            impact_cost: 0.0005
            trade_unit: 100

# ---- 任务定义 ----
task:
    model:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        kwargs:
            base_model: "gbm"
            loss: mse
            # 方案B：小样本（~500条）防过拟合配置
            num_models: 3               # 从6减为3（样本少时集成更多反而过拟合）
            enable_sr: True
            enable_fs: True
            alpha1: 1.0
            alpha2: 1.0
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios: [0.8, 0.7, 0.6, 0.5, 0.4]
            sub_weights:   [1, 1, 1]
            epochs: 100              # 从30增为100，给小学习率留迭代空间
            # LightGBM 子模型超参（针对单股小样本，调低正则让模型能分裂）
            colsample_bytree: 0.8
            learning_rate: 0.03
            subsample: 0.85
            lambda_l1: 0.5           # 大幅降低正则
            lambda_l2: 1.0           # 大幅降低正则
            max_depth: 4
            min_child_samples: 5     # 小样本下叶节点门槛降低
            num_leaves: 16           # 配合 max_depth=4 (2^4=16)
            num_threads: 4
            verbosity: 1

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                # 上市2024-03-28，约500个交易日
                # 按 7:1.5:1.5 切分
                train: [2024-03-28, 2025-06-30]    # ~300条
                valid: [2025-07-01, 2025-12-31]    # ~120条
                test:  [2026-01-01, 2026-04-28]    # ~80条（最新数据）

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model:   <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
